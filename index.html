<html lang="vi">

    <style>
      :root {
        --coral: #ff6b57;

        --yellow: #ffc93c;

      .blob-2 { width: 320px; height: 320px; background: var(--teal); top: 200px; right: -140px; }

      .meal-select-btn { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; padding: 0; flex-shrink: 0; font-size: 12px; font-weight: 700; margin-top: 2px; }

      .amount-edit-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px; font-size: 12px; display: flex; }

      .amount-input { width: 88px; padding: 4px 8px !important; font-size: 12.5px !important; }
      .summary-banner { margin-top: 18px; background: linear-gradient(135deg, #2b2340, #3d3157); border-radius: 18px; padding: 20px 24px; color: #fff; display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
      .summary-label { font-size: 12px; color: #c9c1de; margin-bottom: 4px; }
      .summary-value { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; }
      .settled-flag { margin-left: auto; display: flex; align-items: center; gap: 8px; background: rgba(46, 196, 182, 0.2); color: #6fe3d6; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
      .person-stat-card { position: relative; background: var(--paper); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
      .person-stat-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .person-stat-name { font-weight: 700; font-size: 14.5px; }
      .person-stat-sub { font-size: 11.5px; color: var(--muted); }
      .meals-toggle {

        font-size: 11.5px; color: var(--muted); font-family: "Inter", sans-serif; font-weight: 600;
      }

      .meals-breakdown {
        background: #fdf6ea; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .meals-breakdown-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .mb-check { flex-shrink: 0; }
      .mb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
      .mb-amount { flex-shrink: 0; font-family: "JetBrains Mono", monospace; color: var(--muted); font-size: 11.5px; }
      .person-stat-total-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
      .person-stat-total { font-family: "JetBrains Mono", monospace; font-size: 21px; font-weight: 700; margin-bottom: 10px; }
      .settled-mini-flag { display: inline-flex; align-items: center; gap: 4px; background: rgba(46, 196, 182, 0.15); color: #1d8f84; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
      .mini-progress-track { height: 6px; border-radius: 4px; background: #f0e4d0; overflow: hidden; margin-bottom: 12px; }
      .mini-progress-fill { height: 100%; border-radius: 4px; }
      .person-stat-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 4px; color: var(--muted); }
      .person-stat-row b { font-family: "JetBrains Mono", monospace; color: var(--ink); }
      .adj-add-btn {
        background: none; border: 1.5px dashed var(--border); color: var(--muted); border-radius: 10px;

      .adj-form { margin-top: 12px; background: #fdf6ea; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .sign-toggle { display: flex; gap: 6px; }
      .adj-form-hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
      .sign-btn { flex: 1; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; padding: 7px; font-weight: 700; cursor: pointer; font-size: 13px; color: var(--muted); font-family: "Inter", sans-serif; }
      .sign-btn.active-plus { background: #e6f7f5; border-color: var(--teal); color: #1d8f84; }
      .sign-btn.active-minus { background: #ffece9; border-color: var(--coral); color: #b8482f; }
      .adj-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }
      .adj-form-actions .btn { padding: 7px 14px; font-size: 13px; }
      .adj-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
      .adj-row { display: flex; align-items: center; gap: 8px; font-size: 12px; background: #fdf6ea; border-radius: 8px; padding: 6px 8px; }
      .adj-note { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
      .adj-amount { font-family: "JetBrains Mono", monospace; font-weight: 700; flex-shrink: 0; font-size: 12px; }
      .adj-amount.pos { color: #1d8f84; }
      .adj-amount.neg { color: #d9483a; }
      .adj-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; flex-shrink: 0; padding: 0; }
      .adj-del:hover { color: #d9483a; }
      .batch-hint { font-size: 12.5px; color: var(--muted); margin: -6px 0 14px; }
      .batch-items { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
      .batch-item-row { display: flex; justify-content: space-between; font-size: 12.5px; background: #fdf6ea; border-radius: 8px; padding: 6px 8px; }
      .batch-item-name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .batch-item-amount { font-family: "JetBrains Mono", monospace; font-weight: 600; color: var(--ink); flex-shrink: 0; margin-left: 8px; }
      .batch-total-box { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #2b2340, #3d3157); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; }
      .batch-total-box b { font-family: "JetBrains Mono", monospace; font-size: 17px; }
      .adj-toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-top: 4px; color: var(--muted); }
      .chart-card { padding: 20px; }
      .chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

      .chart-row .m-value { width: 100px; text-align: right; font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 600; }
      .avatar { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-family: "Baloo 2", sans-serif; font-weight: 600; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }

      .empty-state { margin-top: 30px; text-align: center; padding: 50px 20px; border: 2px dashed var(--border); border-radius: 18px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14.5px; }

  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useMemo, useRef } = React;

      // ---------- utils ----------
      const AVATAR_COLORS = ["#FF6B57", "#2EC4B6", "#FFC93C", "#8E7CC3", "#4C9F70", "#FF8FAB", "#5DA9E9", "#F49D37"];
      const uid = () => Math.random().toString(36).slice(2, 10);
      const fmt = (n) => new Intl.NumberFormat("en-US").format(Math.round(n || 0)) + " đ";
      const formatTyping = (raw) => {
        const digits = String(raw).replace(/[^\d]/g, "");
        if (!digits) return "";
        return new Intl.NumberFormat("en-US").format(parseInt(digits, 10));
      };
      const parseTyping = (formatted) => {
        const digits = String(formatted).replace(/[^\d]/g, "");
        return digits ? parseInt(digits, 10) : 0;
      };
      const monthKey = (dateStr) => (dateStr || "").slice(0, 7);
      const monthLabel = (key) => {
        if (!key) return "";
        const [y, m] = key.split("-");
        return `Tháng ${parseInt(m, 10)}/${y}`;
      };
      // Chỉ hiện ngày/tháng, bỏ năm (VD: "2025-03-07" -> "07/03")
      const shortDate = (dateStr) => {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        const [, m, d] = parts;
        return `${d}/${m}`;
      };
      // Chuẩn hoá tên để so sánh (bỏ khoảng trắng thừa, không phân biệt hoa/thường)
      const normName = (name) => String(name || "").trim().toLowerCase();
      const EPS = 1; // sai số làm tròn cho phép (đồng), tránh lỗi số thực kiểu 99999.999999

      // Ảnh đính kèm khi tải biên nhận (vd: QR nhận tiền / lì xì).

      const colorForName = (name) => {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
      };
      const initials = (name) => {
        const parts = name.trim().split(/\s+/);
        return (parts[parts.length - 1] || "").slice(0, 2).toUpperCase();
      };
      // Load 1 ảnh (trả về Promise<HTMLImageElement>), dùng để ghép vào canvas biên nhận
      const loadImage = (src) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      const STORAGE_KEY = "so-chia-tien-vui:meals";
      const STORAGE_KEY_ADJ = "so-chia-tien-vui:adjustments";

      // ---------- Avatar ----------
      function Avatar({ name, size = 32 }) {
        return (
          <div
            className="avatar"
            style={{ width: size, height: size, background: colorForName(name), fontSize: size * 0.38 }}
            title={name}
          >
            {initials(name)}
          </div>
        );
      }

      // ---------- MealForm ----------
      function MealForm({ onAdd, onUpdate, onCancelEdit, knownPeople, editingMeal }) {
        const isEditing = !!editingMeal;
        const [name, setName] = useState(() => editingMeal?.name || "");
        const [date, setDate] = useState(() => editingMeal?.date || new Date().toISOString().slice(0, 10));
        const [amountDisplay, setAmountDisplay] = useState(() =>
          editingMeal ? formatTyping(String(Math.round(editingMeal.amount))) : ""
        );
        const [people, setPeople] = useState(() => editingMeal ? editingMeal.people.map((p) => p.name) : []);
        const [personInput, setPersonInput] = useState("");
        const [error, setError] = useState("");
        const amount = parseTyping(amountDisplay);

        // Khi chuyển sang sửa 1 bữa ăn khác, nạp lại dữ liệu form theo bữa đó
        useEffect(() => {
          if (!editingMeal) return;
          setName(editingMeal.name);
          setDate(editingMeal.date);
          setAmountDisplay(formatTyping(String(Math.round(editingMeal.amount))));
          setPeople(editingMeal.people.map((p) => p.name));
          setError("");
        }, [editingMeal?.id]);

        const addPerson = (val) => {
          const raw = (val ?? personInput).trim();
          if (!raw) return;
          if (people.some((p) => normName(p) === normName(raw))) { setPersonInput(""); return; }
          // Nếu tên này (không phân biệt hoa/thường) đã từng xuất hiện trước đó,
          // dùng lại đúng cách viết cũ để tránh tách thành 2 người khác nhau trong thống kê.
          const existing = knownPeople.find((kp) => normName(kp) === normName(raw));
          const v = existing || raw;
          const next = [...people, v];
          setPeople(next);
          setPersonInput("");
        };
        const removePerson = (p) => {
          setPeople(people.filter((x) => x !== p));
        };

        const submit = () => {
          setError("");
          if (!name.trim()) return setError("Chưa nhập tên bữa ăn 🍽️");
          if (!amount || amount <= 0) return setError("Số tiền phải lớn hơn 0 💰");
          if (people.length === 0) return setError("Cần ít nhất 1 người tham gia 🙋");
          const share = amount / people.length;

          if (isEditing) {
            // Giữ lại số tiền đã trả (paidAmount) của những người vẫn còn tham gia bữa này;
            // người mới thêm vào thì bắt đầu từ 0.
            const oldByKey = {};
            editingMeal.people.forEach((p) => { oldByKey[normName(p.name)] = p.paidAmount || 0; });
            onUpdate({
              ...editingMeal,
              name: name.trim(),
              date,
              amount,
              people: people.map((p) => {
                const key = normName(p);
                const prevPaid = oldByKey[key];
                const paidAmount = prevPaid != null ? Math.min(prevPaid, share) : 0;
                return { name: p, paidAmount };
              }),
            });
            return;
          }

          onAdd({
            id: uid(),
            name: name.trim(),
            date,
            amount,
            people: people.map((p) => ({ name: p, paidAmount: 0 })),
          });
          setName(""); setAmountDisplay(""); setPeople([]); setPersonInput("");
        };

        const suggestions = knownPeople.filter(
          (p) => !people.some((x) => x.toLowerCase() === p.toLowerCase()) &&
            (personInput === "" || p.toLowerCase().includes(personInput.toLowerCase()))
        );

        return (
          <div className={`card fun-shadow ${isEditing ? "meal-form-editing" : ""}`} style={{ padding: 22 }}>
            <div className="card-title">{isEditing ? "✏️ Sửa bữa ăn" : "🍽️ Ghi bữa ăn mới"}</div>
            <div className="form-grid">
              <div>
                <label className="label">Tên bữa ăn</label>
                <input className="input" placeholder="VD: Lẩu Thái tối thứ 6 🌶️" value={name} onChange={(e) => setName(e.target.value)} />
              </div>
              <div>
                <label className="label">Ngày</label>
                <input type="date" className="input" value={date} onChange={(e) => setDate(e.target.value)} />
              </div>
              <div>
                <label className="label">Tổng tiền</label>
                <input className="input" inputMode="numeric" placeholder="200,000" value={amountDisplay} onChange={(e) => setAmountDisplay(formatTyping(e.target.value))} />
              </div>
            </div>

            <div style={{ marginTop: 14 }}>
              <label className="label">Người tham gia</label>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  className="input"
                  placeholder="Nhập tên rồi Enter"
                  value={personInput}
                  onChange={(e) => setPersonInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addPerson(); } }}
                />
                <button className="btn btn-outline" onClick={() => addPerson()} type="button">+ Thêm</button>
              </div>

              {suggestions.length > 0 && (
                <div className="suggestions">
                  {suggestions.slice(0, 6).map((p) => (
                    <button key={p} type="button" className="suggestion-pill" onClick={() => addPerson(p)}>+ {p}</button>
                  ))}
                </div>
              )}

              {people.length > 0 && (
                <div className="chip-row">
                  {people.map((p) => (
                    <span className="chip" key={p}>
                      <Avatar name={p} size={20} />
                      {p}
                      <button onClick={() => removePerson(p)} type="button">×</button>
                    </span>
                  ))}
                </div>
              )}

              {amount > 0 && people.length > 0 && (
                <div className="hint-money">🙂 Mỗi người trả <b>{fmt(amount / people.length)}</b></div>
              )}
            </div>

            {error && <div className="error-text">{error}</div>}
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button className="btn btn-primary" onClick={submit} type="button">
                {isEditing ? "💾 Lưu thay đổi" : "+ Lưu bữa ăn"}
              </button>
              {isEditing && (
                <button className="btn btn-outline" onClick={onCancelEdit} type="button">✖️ Huỷ sửa</button>
              )}
            </div>
          </div>
        );
      }

      // ---------- PersonRow (hỗ trợ trả một phần) ----------
      function PersonRow({ person, share, onToggleFull, onSetAmount }) {
        const [editing, setEditing] = useState(false);
        const [val, setVal] = useState("");
        const paidAmount = Math.max(0, person.paidAmount || 0);
        const fullyPaid = paidAmount >= share - 0.5;
        const partial = paidAmount > 0 && !fullyPaid;

        const startEdit = (e) => {
          e.stopPropagation();
          setVal(formatTyping(String(Math.round(paidAmount))));
          setEditing(true);
        };
        const confirm = (e) => {
          e.stopPropagation();
          onSetAmount(parseTyping(val));
          setEditing(false);
        };
        const cancel = (e) => {
          e.stopPropagation();
          setEditing(false);
        };

        return (
          <div className={`person-row ${fullyPaid ? "paid" : ""}`}>
            <span className="person-left">
              <Avatar name={person.name} size={26} />
              <span>{person.name}</span>
            </span>

            {editing ? (
              <span className="person-right">
                <input
                  className="input amount-input"
                  inputMode="numeric"
                  autoFocus
                  placeholder="0"
                  value={val}
                  onChange={(e) => setVal(formatTyping(e.target.value))}
                  onClick={(e) => e.stopPropagation()}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") confirm(e);
                    if (e.key === "Escape") cancel(e);
                  }}
                />
                <button type="button" className="amount-edit-btn" onClick={confirm} title="Lưu">✅</button>
                <button type="button" className="amount-edit-btn" onClick={cancel} title="Huỷ">✖️</button>
              </span>
            ) : (
              <span className="person-right">
                <span className="person-amount">
                  {partial ? `${fmt(paidAmount)} / ${fmt(share)}` : fmt(share)}
                </span>
                <button type="button" className="amount-edit-btn" onClick={startEdit} title="Nhập số tiền đã trả">✎</button>
                <button
                  type="button"
                  className={`check-btn ${fullyPaid ? "checked" : partial ? "partial" : ""}`}
                  onClick={(e) => { e.stopPropagation(); onToggleFull(); }}
                  aria-label={fullyPaid ? "Đã trả đủ" : "Chưa trả đủ"}
                  title={fullyPaid ? "Đã trả đủ - bấm để bỏ đánh dấu" : "Bấm để đánh dấu đã trả đủ"}
                >
                  {fullyPaid ? "✓" : partial ? "½" : ""}
                </button>
              </span>
            )}
          </div>
        );
      }

      // ---------- MealCard ----------
      function MealCard({ meal, onTogglePaid, onSetAmount, onDelete, onEdit, selected, onToggleSelect }) {
        const share = meal.amount / meal.people.length;
        const totalPaid = meal.people.reduce((s, p) => s + Math.max(0, p.paidAmount || 0), 0);
        const paidCount = meal.people.filter((p) => (p.paidAmount || 0) >= share - 0.5).length;
        const allPaid = paidCount === meal.people.length;
        const progressPct = meal.amount > 0 ? Math.min(100, (totalPaid / meal.amount) * 100) : 0;

        return (
          <div className={`card meal-card ${selected ? "meal-card-selected" : ""}`}>
            <div className="meal-head">
              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                <button
                  type="button"
                  className={`meal-select-btn ${selected ? "checked" : ""}`}
                  onClick={() => onToggleSelect(meal.id)}
                  title={selected ? "Bỏ khỏi đợt đang chọn" : "Thêm vào đợt để xem/chụp riêng"}
                >
                  {selected ? "✓" : ""}
                </button>
                <div>
                  <div className="meal-name">{meal.name}</div>
                  <div className="meal-meta">{shortDate(meal.date)} · {meal.people.length} người · {fmt(share)}/người</div>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div className="meal-amount">{fmt(meal.amount)}</div>
                <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                  <button className="icon-btn" onClick={() => onEdit(meal)} type="button" title="Sửa bữa ăn">✏️ Sửa</button>
                  <button className="icon-btn" onClick={() => onDelete(meal.id)} type="button" title="Xoá bữa ăn">🗑️ Xoá</button>
                </div>
              </div>
            </div>

            <div className="progress-track">
              <div className="progress-fill" style={{ width: `${progressPct}%` }} />
            </div>
            <div className="progress-label">
              {allPaid
                ? "🎉 Mọi người đã trả đủ!"
                : `${fmt(totalPaid)}/${fmt(meal.amount)} đã thu · ${paidCount}/${meal.people.length} người trả đủ`}
            </div>

            <div className="people-list">
              {meal.people.map((p) => (
                <PersonRow
                  key={p.name}
                  person={p}
                  share={share}
                  onToggleFull={() => onTogglePaid(meal.id, p.name)}
                  onSetAmount={(amt) => onSetAmount(meal.id, p.name, amt)}
                />
              ))}
            </div>
          </div>
        );
      }

      // ---------- PersonStatCard ----------
      function PersonStatCard({ name, owed, paid, mealsCount, meals, adjustment, adjustments, onAddAdjustment, onDeleteAdjustment }) {
        const [open, setOpen] = useState(false);
        const [adjOpen, setAdjOpen] = useState(adjustments.length > 0);
        const [adding, setAdding] = useState(false);
        const [sign, setSign] = useState("+");
        const [amountDisplay, setAmountDisplay] = useState("");
        const [note, setNote] = useState("");

        const unpaid = owed - paid - adjustment;
        const effectivePaid = paid + adjustment;
        const pct = owed > 0 ? Math.max(0, Math.min(100, Math.round((effectivePaid / owed) * 100))) : 100;
        const isSettled = unpaid < EPS;

        const submitAdj = () => {
          const amt = parseTyping(amountDisplay);
          if (!amt) return;
          onAddAdjustment(sign === "-" ? -amt : amt, note.trim());
          setAmountDisplay(""); setNote(""); setSign("+"); setAdding(false); setAdjOpen(true);
        };
        const cancelAdj = () => { setAdding(false); setAmountDisplay(""); setNote(""); setSign("+"); };

        return (
          <div className="person-stat-card">
            <div className="person-stat-head">
              <Avatar name={name} size={44} />
              <div>
                <div className="person-stat-name">{name}</div>
                <button type="button" className="meals-toggle" onClick={() => setOpen((o) => !o)}>
                  {mealsCount} bữa ăn {open ? "▴" : "▾"}
                </button>
              </div>
            </div>

            {open && (
              <div className="meals-breakdown">
                {meals.map((m) => (
                  <div className="meals-breakdown-row" key={m.id}>
                    <span className="mb-check">{m.fullyPaid ? "✅" : m.paidAmount > 0 ? "🌗" : "⏳"}</span>
                    <span className="mb-name" title={m.name}>{m.name}</span>
                    <span className="mb-amount">
                      {m.paidAmount > 0 && !m.fullyPaid ? `${fmt(m.paidAmount)}/${fmt(m.share)}` : fmt(m.share)}
                    </span>
                  </div>
                ))}
              </div>
            )}

            <div className="person-stat-total-label">⏳ Còn nợ</div>
            {isSettled ? (
              <div className="settled-mini-flag">✅ Hết nợ</div>
            ) : (
              <div className="person-stat-total" style={{ color: "#FF6B57" }}>{fmt(unpaid)}</div>
            )}
            <div className="mini-progress-track">
              <div className="mini-progress-fill" style={{ width: `${pct}%`, background: colorForName(name) }} />
            </div>
            <div className="person-stat-row"><span>✅ Đã trả</span><b>{fmt(paid)}</b></div>

            {adjustments.length > 0 && (
              <div className="adj-toggle-row">
                <button type="button" className="meals-toggle" onClick={() => setAdjOpen((o) => !o)}>
                  🧾 Điều chỉnh {adjOpen ? "▴" : "▾"}
                </button>
                <b style={{ fontFamily: '"JetBrains Mono", monospace', color: adjustment >= 0 ? "#1d8f84" : "#d9483a" }}>
                  {adjustment >= 0 ? "+" : "−"}{fmt(Math.abs(adjustment))}
                </b>
              </div>
            )}

            {adjOpen && adjustments.length > 0 && (
              <div className="adj-list">
                {adjustments.map((a) => (
                  <div className="adj-row" key={a.id}>
                    <span className="adj-note" title={a.note}>{a.note || (a.amount >= 0 ? "Giảm nợ" : "Tăng nợ")}</span>
                    <span className={`adj-amount ${a.amount >= 0 ? "pos" : "neg"}`}>
                      {a.amount >= 0 ? "+" : "−"}{fmt(Math.abs(a.amount))}
                    </span>
                    <button type="button" className="adj-del" onClick={() => onDeleteAdjustment(a.id)} title="Xoá khoản này">✕</button>
                  </div>
                ))}
              </div>
            )}

            {adding ? (
              <div className="adj-form">
                <div className="sign-toggle">
                  <button type="button" className={`sign-btn ${sign === "+" ? "active-plus" : ""}`} onClick={() => setSign("+")}>+ Giảm nợ</button>
                  <button type="button" className={`sign-btn ${sign === "-" ? "active-minus" : ""}`} onClick={() => setSign("-")}>− Tăng nợ</button>
                </div>
                <div className="adj-form-hint">
                  {sign === "+"
                    ? "Dùng khi họ đã trả bạn riêng, hoặc bạn nợ họ khoản khác → nợ của họ giảm."
                    : "Dùng khi phát sinh thêm chi phí họ phải trả → nợ của họ tăng."}
                </div>
                <input
                  className="input"
                  inputMode="numeric"
                  placeholder="Số tiền"
                  value={amountDisplay}
                  onChange={(e) => setAmountDisplay(formatTyping(e.target.value))}
                  autoFocus
                />
                <input
                  className="input"
                  placeholder="Ghi chú (VD: chuyển khoản thêm, mua nước riêng...)"
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") submitAdj(); }}
                />
                <div className="adj-form-actions">
                  <button type="button" className="btn btn-outline" onClick={cancelAdj}>Huỷ</button>
                  <button type="button" className="btn btn-primary" onClick={submitAdj}>Lưu</button>
                </div>
              </div>
            ) : (
              <button type="button" className="adj-add-btn" onClick={() => setAdding(true)}>± Cộng / trừ tiền + ghi chú</button>
            )}
          </div>
        );
      }

      // ---------- BatchReceiptCard (biên nhận theo đợt tự chọn) ----------
      function BatchReceiptCard({ data }) {
        const { name, oldDebt, batchItems, batchTotal, grandTotal } = data;
        const cardRef = useRef(null);
        const [capturing, setCapturing] = useState(false);
        const [attachImage, setAttachImage] = useState(true);

        const downloadImage = async () => {
          if (!cardRef.current || typeof html2canvas === "undefined") {
            alert("Không tải được thư viện xuất ảnh (html2canvas). Kiểm tra lại kết nối mạng rồi thử lại.");
            return;
          }
          setCapturing(true);
          try {
            const cardCanvas = await html2canvas(cardRef.current, { backgroundColor: "#fffdf8", scale: 2 });

            let finalCanvas = cardCanvas;
            if (attachImage) {
              // Ghép thêm ảnh đính kèm (vd: QR nhận tiền) vào bên dưới ảnh biên nhận
              const attach = await loadImage(RECEIPT_ATTACHMENT_IMAGE);
              const attachW = cardCanvas.width;
              const attachH = (attach.height / attach.width) * attachW;
              const gap = 16;

              finalCanvas = document.createElement("canvas");
              finalCanvas.width = cardCanvas.width;
              finalCanvas.height = cardCanvas.height + gap + attachH;
              const ctx = finalCanvas.getContext("2d");
              ctx.fillStyle = "#fffdf8";
              ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
              ctx.drawImage(cardCanvas, 0, 0);
              ctx.drawImage(attach, 0, cardCanvas.height + gap, attachW, attachH);
            }

            const link = document.createElement("a");
            link.download = `bien-nhan-${name.replace(/\s+/g, "-").toLowerCase()}.png`;
            link.href = finalCanvas.toDataURL("image/png");
            link.click();
          } catch (e) {
            console.error(e);
            alert("Xuất ảnh thất bại, bạn có thể chụp màn hình thủ công thay thế.");
          } finally {
            setCapturing(false);
          }
        };

        return (
          <div className="person-stat-card" ref={cardRef}>
            <div className="person-stat-head">
              <Avatar name={name} size={44} />
              <div>
                <div className="person-stat-name">{name}</div>
                <div className="person-stat-sub">{batchItems.length} bữa trong đợt này</div>
              </div>
            </div>

            <div className="person-stat-row"><span>⏳ Nợ cũ (trước đợt này)</span><b style={{ color: oldDebt > 0 ? "#FF6B57" : "#2EC4B6" }}>{fmt(oldDebt)}</b></div>

            <div className="batch-items">
              {batchItems.map((it) => {
                const isPaid = it.remaining <= 0.5;
                const isPartial = it.paidAmount > 0 && !isPaid;
                return (
                  <div className="batch-item-row" key={it.id}>
                    <span className="batch-item-name" title={it.name}>
                      {it.name}
                      {isPaid && " ✅"}
                      {isPartial && " 🌗"}
                    </span>
                    <span className="batch-item-amount">
                      {isPaid ? (
                        <span style={{ color: "#1d8f84" }}>Đã trả</span>
                      ) : isPartial ? (
                        `${fmt(it.remaining)} (đã trả ${fmt(it.paidAmount)}/${fmt(it.share)})`
                      ) : (
                        fmt(it.remaining)
                      )}
                    </span>
                  </div>
                );
              })}
            </div>
            <div className="person-stat-row"><span>🍜 Còn thiếu đợt này</span><b>{fmt(batchTotal)}</b></div>

            <div className="batch-total-box">
              <span>Tổng cần trả</span>
              <b>{fmt(grandTotal)}</b>
            </div>

            <label className="attach-toggle" data-html2canvas-ignore="true">
              <input type="checkbox" checked={attachImage} onChange={(e) => setAttachImage(e.target.checked)} />
              <img src={RECEIPT_ATTACHMENT_IMAGE} alt="Ảnh đính kèm" className="attach-thumb" />
              <span>Kèm ảnh QR nhận tiền khi tải</span>
            </label>

            <button type="button" className="adj-add-btn" onClick={downloadImage} disabled={capturing} data-html2canvas-ignore="true">
              {capturing ? "⏳ Đang xuất ảnh..." : "📸 Tải ảnh biên nhận"}
            </button>
          </div>
        );
      }

      // ---------- MonthlyChart (thanh ngang CSS, không cần thư viện) ----------
      function MonthlyChart({ data }) {
        if (data.length === 0) return null;
        const max = Math.max(...data.map((d) => d.total));
        return (
          <div className="card fun-shadow chart-card">
            <div className="card-title">📊 Chi tiêu theo tháng</div>
            {data.map((d) => (
              <div className="chart-row" key={d.label}>
                <div className="m-label">{d.label}</div>
                <div className="m-track"><div className="m-fill" style={{ width: `${(d.total / max) * 100}%` }} /></div>
                <div className="m-value">{fmt(d.total)}</div>
              </div>
            ))}
          </div>
        );
      }

      // ---------- App ----------
      function App() {
        const [meals, setMeals] = useState(() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            const parsed = raw ? JSON.parse(raw) : [];
            // Chuyển dữ liệu cũ (paid: true/false) sang paidAmount để hỗ trợ trả một phần
            return parsed.map((m) => {
              const share = m.people.length ? m.amount / m.people.length : 0;
              return {
                ...m,
                people: m.people.map((p) => ({
                  name: p.name,
                  paidAmount: p.paidAmount != null ? p.paidAmount : p.paid ? share : 0,
                })),
              };
            });
          } catch { return []; }
        });
        const [adjustments, setAdjustments] = useState(() => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY_ADJ);
            return raw ? JSON.parse(raw) : [];
          } catch { return []; }
        });
        const [monthFilter, setMonthFilter] = useState("all");
        const [editingMealId, setEditingMealId] = useState(null);
        const [selectedMealIds, setSelectedMealIds] = useState([]);
        const toggleMealSelect = (id) => {
          setSelectedMealIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
        };
        const clearMealSelection = () => setSelectedMealIds([]);

        useEffect(() => {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(meals)); } catch {}
        }, [meals]);

        useEffect(() => {
          try { localStorage.setItem(STORAGE_KEY_ADJ, JSON.stringify(adjustments)); } catch {}
        }, [adjustments]);

        const addMeal = (meal) => {
          const next = [meal, ...meals];
          setMeals(next);
        };
        const deleteMeal = (id) => {
          const meal = meals.find((x) => x.id === id);
          const label = meal ? `"${meal.name}"` : "bữa ăn này";
          if (!window.confirm(`Xoá ${label}? Hành động này không thể hoàn tác.`)) return;
          const next = meals.filter((x) => x.id !== id);
          setMeals(next);
          if (editingMealId === id) setEditingMealId(null);
        };
        const updateMeal = (updatedMeal) => {
          const next = meals.map((m) => (m.id === updatedMeal.id ? updatedMeal : m));
          setMeals(next);
          setEditingMealId(null);
        };
        const startEditMeal = (meal) => {
          setEditingMealId(meal.id);
          // Cuộn lên form để người dùng thấy form đang chuyển sang chế độ Sửa
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const cancelEditMeal = () => setEditingMealId(null);
        const editingMeal = editingMealId ? meals.find((m) => m.id === editingMealId) || null : null;
        const addAdjustment = (name, amount, note) => {
          const today = new Date().toISOString().slice(0, 10);
          // Nếu đang lọc theo 1 tháng cụ thể (khác "Tất cả"), gán ngày điều chỉnh vào
          // giữa tháng đó để nó không "biến mất" khỏi view đang xem sau khi lưu.
          const date = monthFilter !== "all" ? `${monthFilter}-15` : today;
          const next = [{ id: uid(), name, amount, note, date }, ...adjustments];
          setAdjustments(next);
        };
        const deleteAdjustment = (id) => {
          if (!window.confirm("Xoá khoản điều chỉnh này?")) return;
          const next = adjustments.filter((x) => x.id !== id);
          setAdjustments(next);
        };
        const togglePaid = (mealId, personName) => {
          const next = meals.map((meal) => {
            if (meal.id !== mealId) return meal;
            const share = meal.amount / meal.people.length;
            return {
              ...meal,
              people: meal.people.map((p) => {
                if (p.name !== personName) return p;
                const isFull = (p.paidAmount || 0) >= share - 0.5;
                return { ...p, paidAmount: isFull ? 0 : share };
              }),
            };
          });
          setMeals(next);
        };
        const setPersonAmount = (mealId, personName, amount) => {
          const next = meals.map((meal) => {
            if (meal.id !== mealId) return meal;
            const share = meal.amount / meal.people.length;
            const clamped = Math.max(0, Math.min(amount, share));
            return {
              ...meal,
              people: meal.people.map((p) => (p.name === personName ? { ...p, paidAmount: clamped } : p)),
            };
          });
          setMeals(next);
        };

        const knownPeople = useMemo(() => {
          const map = new Map(); // key: tên chuẩn hoá -> giá trị: cách viết xuất hiện đầu tiên
          meals.forEach((m) => m.people.forEach((p) => {
            const key = normName(p.name);
            if (!map.has(key)) map.set(key, p.name);
          }));
          return Array.from(map.values());
        }, [meals]);

        const months = useMemo(() => {
          const set = new Set(meals.map((m) => monthKey(m.date)));
          adjustments.forEach((a) => set.add(monthKey(a.date)));
          return Array.from(set).sort().reverse();
        }, [meals, adjustments]);

        const visibleMeals = useMemo(
          () => (monthFilter === "all" ? meals : meals.filter((m) => monthKey(m.date) === monthFilter)),
          [meals, monthFilter]
        );
        const visibleAdjustments = useMemo(
          () => (monthFilter === "all" ? adjustments : adjustments.filter((a) => monthKey(a.date) === monthFilter)),
          [adjustments, monthFilter]
        );
        const sortedMeals = useMemo(() => [...visibleMeals].sort((a, b) => (a.date < b.date ? 1 : -1)), [visibleMeals]);

        const perPerson = useMemo(() => {
          const map = {};
          const ensure = (name) => {
            const key = normName(name);
            if (!map[key]) map[key] = { name, owed: 0, paid: 0, mealsCount: 0, meals: [], adjustment: 0, adjustments: [] };
            return map[key];
          };
          visibleMeals.forEach((m) => {
            const share = m.amount / m.people.length;
            m.people.forEach((p) => {
              const rec = ensure(p.name);
              const paidAmount = Math.max(0, p.paidAmount || 0);
              rec.owed += share;
              rec.mealsCount += 1;
              rec.paid += paidAmount;
              rec.meals.push({ id: m.id, name: m.name, date: m.date, share, paidAmount, fullyPaid: paidAmount >= share - 0.5 });
            });
          });
          visibleAdjustments.forEach((a) => {
            const rec = ensure(a.name);
            rec.adjustment += a.amount;
            rec.adjustments.push(a);
          });
          Object.values(map).forEach((p) => {
            p.meals.sort((a, b) => (a.date < b.date ? 1 : -1));
            p.adjustments.sort((a, b) => (a.date < b.date ? 1 : -1));
          });
          return Object.values(map).sort((a, b) => b.owed - a.owed);
        }, [visibleMeals, visibleAdjustments]);

        const grandTotal = useMemo(() => visibleMeals.reduce((s, m) => s + m.amount, 0), [visibleMeals]);
        // Tính giống hệt công thức "còn nợ" ở từng thẻ cá nhân (owed - paid - adjustment)
        // để tổng ở banner luôn khớp với tổng cộng dồn từ các thẻ bên dưới.
        const totalUnpaid = useMemo(
          () => perPerson.reduce((s, p) => s + Math.max(0, p.owed - p.paid - p.adjustment), 0),
          [perPerson]
        );
        const allSettled = visibleMeals.length > 0 && totalUnpaid < EPS;

        const batchData = useMemo(() => {
          if (selectedMealIds.length === 0) return [];
          const map = {};
          const ensure = (name) => {
            const key = normName(name);
            if (!map[key]) map[key] = { name, oldOwed: 0, oldPaid: 0, oldAdjustment: 0, batchItems: [], batchTotal: 0 };
            return map[key];
          };
          meals.forEach((m) => {
            const share = m.amount / m.people.length;
            const isSelected = selectedMealIds.includes(m.id);
            m.people.forEach((p) => {
              const rec = ensure(p.name);
              const paidAmount = Math.max(0, p.paidAmount || 0);
              if (isSelected) {
                // Trừ phần đã tích thanh toán trước đó, chỉ tính số còn thiếu vào biên nhận
                const remaining = Math.max(0, share - paidAmount);
                rec.batchItems.push({ id: m.id, name: m.name, date: m.date, share, paidAmount, remaining });
                rec.batchTotal += remaining;
              } else {
                rec.oldOwed += share;
                rec.oldPaid += paidAmount;
              }
            });
          });
          adjustments.forEach((a) => {
            ensure(a.name).oldAdjustment += a.amount;
          });
          return Object.values(map)
            .filter((p) => p.batchItems.length > 0)
            .map((p) => {
              const oldDebt = p.oldOwed - p.oldPaid - p.oldAdjustment;
              return { ...p, oldDebt, grandTotal: oldDebt + p.batchTotal };
            })
            // Ai không còn nợ gì (Tổng cần trả <= 0) thì không cần hiện biên nhận nữa
            .filter((p) => p.grandTotal > EPS)
            .sort((a, b) => b.grandTotal - a.grandTotal);
        }, [meals, adjustments, selectedMealIds]);

        const chartData = useMemo(() => {
          const map = {};
          meals.forEach((m) => { const k = monthKey(m.date); map[k] = (map[k] || 0) + m.amount; });
          return Object.entries(map).sort(([a], [b]) => (a < b ? -1 : 1)).map(([k, total]) => ({ label: monthLabel(k).replace("Tháng ", "T"), total }));
        }, [meals]);

        return (
          <div className="app-bg">
            <div className="blob blob-1" />
            <div className="blob blob-2" />
            <div className="blob blob-3" />
            <div className="container">
              <header className="header">
                <div className="eyebrow">TIỆC TÙNG · HOÁ ĐƠN · CHIA ĐỀU</div>
                <h1>Sổ Chia Tiền Vui 🍜</h1>
                <p>Ghi bữa ăn, chia đều chi phí, tích ai đã trả — gọn trong một nốt nhạc.</p>
              </header>

              <MealForm
                onAdd={addMeal}
                onUpdate={updateMeal}
                onCancelEdit={cancelEditMeal}
                knownPeople={knownPeople}
                editingMeal={editingMeal}
              />

              {meals.length > 0 && (
                <React.Fragment>
                  <div className="section-head">
                    <h2>🧾 Danh sách bữa ăn</h2>
                    <select className="input select-month" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)}>
                      <option value="all">Tất cả các tháng</option>
                      {months.map((mk) => <option key={mk} value={mk}>{monthLabel(mk)}</option>)}
                    </select>
                  </div>
                  <div className="batch-hint">☑️ Tích chọn các bữa ăn bên dưới để gộp thành 1 đợt, xem biên nhận riêng cho từng người rồi chụp gửi.</div>

                  {sortedMeals.length === 0 ? (
                    <div className="empty-note">Không có bữa ăn nào trong tháng này.</div>
                  ) : (
                    <div className="meal-grid">
                      {sortedMeals.map((m) => (
                        <MealCard
                          key={m.id}
                          meal={m}
                          onTogglePaid={togglePaid}
                          onSetAmount={setPersonAmount}
                          onDelete={deleteMeal}
                          onEdit={startEditMeal}
                          selected={selectedMealIds.includes(m.id)}
                          onToggleSelect={toggleMealSelect}
                        />
                      ))}
                    </div>
                  )}

                  {selectedMealIds.length > 0 && (
                    <React.Fragment>
                      <div className="section-head">
                        <h2>📸 Biên nhận theo đợt đã chọn ({selectedMealIds.length} bữa)</h2>
                        <button type="button" className="btn btn-outline" onClick={clearMealSelection}>Bỏ chọn</button>
                      </div>
                      {batchData.length > 0 ? (
                        <React.Fragment>
                          <div className="batch-hint">
                            ℹ️ "Nợ cũ" tính trên <b>toàn bộ lịch sử</b> (không giới hạn theo bộ lọc tháng đang chọn ở trên), để phản ánh đúng tổng nợ thực tế cần thu. Ai đã trả đủ (Tổng cần trả = 0) sẽ không hiện ở đây.
                          </div>
                          <div className="stat-grid">
                            {batchData.map((p) => (
                              <BatchReceiptCard key={p.name} data={p} />
                            ))}
                          </div>
                        </React.Fragment>
                      ) : (
                        <div className="empty-note">🎉 Mọi người trong đợt này đều đã thanh toán đủ, không còn ai cần gửi biên nhận!</div>
                      )}
                    </React.Fragment>
                  )}

                  {visibleMeals.length > 0 && (
                    <React.Fragment>
                      <div className="summary-banner">
                        <div>
                          <div className="summary-label">Tổng chi {monthFilter === "all" ? "tất cả" : monthLabel(monthFilter)}</div>
                          <div className="summary-value">{fmt(grandTotal)}</div>
                        </div>
                        <div>
                          <div className="summary-label">Còn chưa thu</div>
                          <div className="summary-value" style={{ color: totalUnpaid > 0 ? "#FF6B57" : "#2EC4B6" }}>{fmt(totalUnpaid)}</div>
                        </div>
                        {allSettled && <div className="settled-flag">🎉 Đã thu đủ hết rồi!</div>}
                      </div>

                      <div className="section-head">
                        <h2>🏅 Thống kê từng người</h2>
                        <select className="input select-month" value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)}>
                          <option value="all">Tất cả các tháng</option>
                          {months.map((mk) => <option key={mk} value={mk}>{monthLabel(mk)}</option>)}
                        </select>
                      </div>
                      <div className="stats-summary-line">
                        📅 {monthFilter === "all" ? "Tất cả các tháng" : monthLabel(monthFilter)} · 👥 {perPerson.length} người ·
                        {" "}🍜 Tổng chi <b>{fmt(grandTotal)}</b> ·
                        {" "}⏳ Còn thiếu <b style={{ color: totalUnpaid > 0 ? "#FF6B57" : "#2EC4B6" }}>{fmt(totalUnpaid)}</b>
                      </div>
                      <div className="stat-grid">
                        {perPerson.map((p) => (
                          <PersonStatCard
                            key={p.name}
                            name={p.name}
                            owed={p.owed}
                            paid={p.paid}
                            mealsCount={p.mealsCount}
                            meals={p.meals}
                            adjustment={p.adjustment}
                            adjustments={p.adjustments}
                            onAddAdjustment={(amount, note) => addAdjustment(p.name, amount, note)}
                            onDeleteAdjustment={(id) => deleteAdjustment(id)}
                          />
                        ))}
                      </div>
                    </React.Fragment>
                  )}

                  <div style={{ marginTop: 22 }}><MonthlyChart data={chartData} /></div>
                </React.Fragment>
              )}

              {meals.length === 0 && (
                <div className="empty-state">
                  🏆
                  <div>Chưa có bữa ăn nào. Ghi bữa đầu tiên ở form phía trên nhé!</div>
                </div>
              )}

              <footer className="footer">Dữ liệu lưu ngay trên trình duyệt này của bạn 🔒</footer>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
